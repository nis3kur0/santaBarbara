<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de Empleado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .carnet {
            width: 300px;
            height: 200px;
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .foto {
            width: 80px;
            height: 80px;
            border: 1px solid #000000;
            background-color: #e0e0e0;
            margin-bottom: 15px;
        }
        .nombre {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .cedula, .codigo {
            font-size: 14px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="carnet">
        <div class="foto"></div>
        <div class="nombre">Nombre del Empleado</div>
        <div class="cedula">Cédula: 123456789</div>
        <div class="codigo">Código: EMP001</div>
    </div>
</body>
</html>
